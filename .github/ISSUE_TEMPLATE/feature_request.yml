name: Feature Request
description: Propose a new feature or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose clearly: what problem it solves and success criteria.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What problem this solves
      placeholder: e.g. Generate monthly bills automatically
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Measurable conditions marking the feature complete
      placeholder: |
        - [ ] A bill appears for each active contract per period
        - [ ] No duplicate bills are created
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope & Non-Goals
      description: What's included and intentionally excluded
      placeholder: Non-goal: multi-property, tenant portal
