name: Bug Report
description: Report a bug/defect
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Fill out all sections.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, concise
      placeholder: e.g. Bills page is blank after selecting a month
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps that trigger the bug
      placeholder: |
        1. Log in as owner
        2. Open Bills
        3. Select period Jan 2026
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, account (owner/admin), env (staging/prod)
      placeholder: Chrome 120, Windows, staging, owner1
