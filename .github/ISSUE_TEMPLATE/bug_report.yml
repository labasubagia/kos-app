name: Bug Report
description: Laporkan bug/defect
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih melaporkan. Lengkapi semua bagian.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Apa yang terjadi, ringkas
      placeholder: e.g. Halaman tagihan blank setelah pilih bulan
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Langkah untuk memunculkan bug
      placeholder: |
        1. Login sebagai owner
        2. Buka Tagihan
        3. Pilih periode Jan 2026
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Apa yang seharusnya terjadi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Apa yang benar-benar terjadi
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, akun (owner/admin), env (staging/prod)
      placeholder: Chrome 120, Windows, staging, owner1
