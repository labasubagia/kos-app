name: Chore / Task
description: Internal task, refactor, maintenance
title: "chore: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Non-feature task: refactor, technical, documentation.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background/rationale
    validations:
      required: true
  - type: textarea
    id: breakdown
    attributes:
      label: Task Breakdown
      description: Concrete steps
      placeholder: |
        - [ ] Replace helper X
        - [ ] Update tests
