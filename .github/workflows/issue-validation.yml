name: Issue Template Validation

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            const expectations = {
              bug:     ["Description", "Steps to Reproduce", "Expected Behavior", "Actual Behavior"],
              feature:  ["Goal", "Acceptance Criteria", "Scope & Non-Goals"],
              chore:   ["Context", "Task Breakdown"],
            };

            const has = (h) => body.includes(`### ${h}`);

            // Guess template by highest heading-match score
            let best = null, bestScore = -1, missingOfBest = [];
            for (const [t, heads] of Object.entries(expectations)) {
              const missing = heads.filter((h) => !has(h));
              const score = heads.length - missing.length;
              if (score > bestScore) { bestScore = score; best = t; missingOfBest = missing; }
            }

            if (missingOfBest.length) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `⚠️ Issue does not match the \`${best}\` template. Missing sections: ${missingOfBest.join(", ")}. Please complete them.`,
              });
            }
