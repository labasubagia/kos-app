name: Issue Template Validation

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            const expectations = {
              bug:     ["Description", "Steps to Reproduce", "Expected Behavior", "Actual Behavior"],
              feature:  ["Goal", "Acceptance Criteria", "Scope & Non-Goals"],
              chore:   ["Context", "Task Breakdown"],
            };

            const has = (h) => body.includes(`### ${h}`);

            // Template is chosen by the form via its label (set in ISSUE_TEMPLATE).
            const byLabel = { bug: expectations.bug, enhancement: expectations.feature, chore: expectations.chore };
            const label = context.payload.issue.labels?.map((l) => l.name).find((l) => byLabel[l]);
            if (!label) {
              console.log(`No template label on issue #${context.issue.number}; skipping validation.`);
              return;
            }

            const missing = byLabel[label].filter((h) => !has(h));
            if (missing.length) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `⚠️ Issue does not match the \`${label}\` template. Missing sections: ${missing.join(", ")}. Please complete them.`,
              });
            }
