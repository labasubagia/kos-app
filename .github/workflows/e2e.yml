name: E2E

on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # App + tests talk to the local Supabase stack started below (no hosted secrets).
      E2E_EMAIL: ci-e2e@example.com
      E2E_PASS: ci-e2e-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: "^2.20.9"

      - name: Cache Supabase Docker images
        id: sb-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/supabase-images.tar.gz
          key: supabase-docker-${{ hashFiles('supabase/config.toml') }}-v2

      - name: Load cached Supabase images
        if: steps.sb-cache.outputs.cache-hit == 'true'
        run: gzip -dc /tmp/supabase-images.tar.gz | docker load

      - name: Start local Supabase (Docker)
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            echo "== supabase start attempt $i =="
            if supabase start; then
              echo "supabase stack ready"
              exit 0
            fi
            echo "attempt $i failed; retrying in 25s"
            sleep 25
          done
          echo "supabase start failed after 5 attempts" >&2
          exit 1

      - name: Save Supabase Docker images
        if: steps.sb-cache.outputs.cache-hit != 'true'
        run: |
          docker save $(docker ps -aq --format '{{.Image}}' | sort -u) | gzip > /tmp/supabase-images.tar.gz

      - name: Commit Supabase image cache
        if: steps.sb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/supabase-images.tar.gz
          key: supabase-docker-${{ hashFiles('supabase/config.toml') }}-v2

      - name: Capture local Supabase endpoints
        id: sb
        run: |
          set -euo pipefail
          node scripts/ci-supabase-env.mjs > /tmp/sb.env
          cat /tmp/sb.env >> "$GITHUB_OUTPUT"
      - name: Provision CI user + owner tenant
        run: node scripts/ci-supabase-setup.mjs
        env:
          PUBLIC_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ steps.sb.outputs.anon }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.sb.outputs.service }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit + DB flow tests (local Supabase)
        run: npm run test
        env:
          PUBLIC_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ steps.sb.outputs.anon }}
          CI: "true"

      - name: E2E tests (local Supabase)
        run: npm run test:e2e
        env:
          PUBLIC_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ steps.sb.outputs.anon }}
          CI: "true"
