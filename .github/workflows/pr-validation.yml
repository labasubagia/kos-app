name: PR Template Validation

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]
permissions:
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const required = [
              "Description",
              "Type of change",
              "Changes",
              "Testing",
              "Checklist",
            ];

            // Heading may be followed by a description in parentheses (e.g. "Description")
            const has = (h) => new RegExp(`^##\\s+${h.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}`, "m").test(body);
            const missing = required.filter((h) => !has(h));

            const label = "invalid";
            const prNumber = context.payload.pull_request.number;
            const hide = (p) => p.catch(() => {});

            if (missing.length) {
              await hide(github.rest.issues.addLabels({
                ...context.repo, issue_number: prNumber, labels: [label],
              }));
              await hide(github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body: `⚠️ PR does not match the template. Missing sections: ${missing.join(", ")}. Please fill them in.`,
              }));
            } else {
              await hide(github.rest.issues.removeLabel({
                ...context.repo, issue_number: prNumber, name: label,
              }));
            }
