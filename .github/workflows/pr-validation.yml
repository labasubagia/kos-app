name: PR Template Validation

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]
permissions:
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const required = [
              "Description",
              "Type of change",
              "Changes",
              "Testing",
              "Checklist",
            ];

            // Heading may be followed by a description in parentheses (e.g. "Description")
            const has = (h) => new RegExp(`^##\s+${h.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}`, "m").test(body);
            const missing = required.filter((h) => !has(h));

            const prNumber = context.payload.pull_request.number;

            if (missing.length) {
              core.setFailed(`PR does not match template. Missing sections: ${missing.join(", ")}`);
            }